<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXIFLY</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050816;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bg {
      position: absolute;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at center, rgba(84, 120, 255, 0.15), transparent 30%),
        radial-gradient(circle at top left, rgba(174, 0, 255, 0.12), transparent 25%),
        radial-gradient(circle at bottom right, rgba(0, 255, 255, 0.08), transparent 25%);
      animation: move 12s infinite alternate ease-in-out;
    }

    @keyframes move {
      from {
        transform: translate(-5%, -5%);
      }
      to {
        transform: translate(5%, 5%);
      }
    }

    .content {
      text-align: center;
      z-index: 2;
    }

    .logo {
      font-size: 5rem;
      font-weight: 200;
      letter-spacing: 14px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #66d9ff, #8b5cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .coming {
      font-size: 0.9rem;
      opacity: 0.5;
      letter-spacing: 6px;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(106, 90, 255, 0.15);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 1;
    }

  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="logo">NEXIFLY</div>
    <div class="subtitle">AI • AUTOMATION • FUTURE</div>
    <div class="coming">COMING SOON</div>
  </div>

</body>
</html>
